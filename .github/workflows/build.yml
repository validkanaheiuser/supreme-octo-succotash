name: Build TouchGeoFix (arm64e)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/_theos

jobs:
  build:
    name: Build .deb (iphoneos-arm64e)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Debug: verify repo files reached the runner ───────────────────────
      - name: Debug file structure
        run: |
          echo "=== Project root ===" && ls -la
          echo "=== Resources/ ===" && ls -la Resources/ 2>/dev/null || echo "(missing)"
          echo "=== layout/ (recursive) ===" && find layout/ -type f 2>/dev/null || echo "(missing)"

      # ── Cache Theos core (makefiles, vendor, templates) ──────────────────
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/_theos
          key: theos-${{ runner.os }}-v2

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      # ── Cache iOS 16.5 SDK separately so SDK updates don't bust Theos ────
      - name: Cache iOS 16.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/_theos/sdks/iPhoneOS16.5.sdk
          key: sdk-iphoneos-16.5-v2

      - name: Download iOS 16.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # Sparse-checkout only the needed SDK directory (~200 MB vs 2 GB full clone)
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk $THEOS/sdks/

      # ── Build dependencies ────────────────────────────────────────────────
      - name: Install ldid
        run: brew install ldid

      # ── Debug: find exactly where Theos checks for filter plist ──────────
      - name: Debug Theos filter plist logic
        run: |
          echo "=== Makefile dir structure ==="
          ls $THEOS/makefiles/
          echo "=== Searching all makefiles for filter plist error ==="
          grep -rn "missing a filter\|FILTER_PLIST\|filter_plist\|Filter\.plist" \
            $THEOS/makefiles/ 2>/dev/null || echo "(nothing matched anywhere)"
          echo "=== THEOS_PACKAGE_INSTALL_PREFIX value ==="
          make -f $THEOS/makefiles/package.mk print-THEOS_PACKAGE_INSTALL_PREFIX \
            THEOS_PACKAGE_SCHEME=rootless 2>/dev/null || true

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build package
        run: |
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64e

      - name: Show produced .deb
        run: ls -lah packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchGeoFix-arm64e-${{ github.sha }}
          path: packages/*.deb
          retention-days: 30
