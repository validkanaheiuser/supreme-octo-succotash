name: Build TouchGeoFix (arm64e)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/_theos

jobs:
  build:
    name: Build .deb (iphoneos-arm64e)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Cache Theos core (makefiles, vendor, templates) ──────────────────
      - name: Cache Theos
        id: theos-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/_theos
          key: theos-${{ runner.os }}-v1

      - name: Install Theos
        if: steps.theos-cache.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      # ── Cache iOS 16.5 SDK separately so SDK updates don't bust Theos ────
      - name: Cache iOS 16.5 SDK
        id: sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/_theos/sdks/iPhoneOS16.5.sdk
          key: sdk-iphoneos-16.5-v1

      - name: Download iOS 16.5 SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          # Sparse-checkout only the needed SDK directory (~200 MB vs 2 GB full clone)
          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/theos/sdks.git /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -r iPhoneOS16.5.sdk $THEOS/sdks/

      # ── Build dependencies ────────────────────────────────────────────────
      - name: Install ldid
        run: brew install ldid

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build package
        run: |
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=rootless \
            ARCHS=arm64e

      - name: Show produced .deb
        run: ls -lah packages/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: TouchGeoFix-arm64e-${{ github.sha }}
          path: packages/*.deb
          retention-days: 30
